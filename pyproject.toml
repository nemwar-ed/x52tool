[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x52tool"
version = "0.0.1b0"
description = "Test, calibration and LED/MFD tool for the Saitek / Logitech X52 and X52 Pro on Linux"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4",
    "evdev>=1.6",
]
keywords = ["x52", "joystick", "hotas", "linux", "evdev", "libx52"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware",
]

[project.scripts]
x52tool = "x52tool.__main__:main"

[project.urls]
Homepage = "https://github.com/nemwar-ed/x52tool"
Repository = "https://github.com/nemwar-ed/x52tool"
Issues = "https://github.com/nemwar-ed/x52tool/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["x52tool*"]

[tool.setuptools.package-data]
"x52tool" = ["lang/*.lng", "ui/lang/*.lng"]
